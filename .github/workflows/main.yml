name: Deploy Website via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sync files to Hosting
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 📂 Upload Files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Ganti 'public_html/' sesuai folder root website di hosting kamu (contoh: public_html/, htdocs/, dsb.)
          server-dir: public_html/
          protocol: ftp
          port: 21
          security: false # Menonaktifkan TLS data socket jika hosting memutus koneksi pasif (ECONNRESET)
          timeout: 60000
